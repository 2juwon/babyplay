<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#ffe48a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="태오플레이">
<title>태오플레이 놀이 고르기</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* VOICE: 밝고 포근한 아이 놀이방
IDEA: 장난감 상자에 꽂힌 커다란 놀이 카드
PICTURE: 게임마다 그림이 꽉 찬 큰 카드, 손가락 하나로 누르기 쉽게
COLOUR/TYPE: 햇살 노랑 바탕, 진한 갈색 글씨, 카드마다 게임 색; Jua
LAYOUT: 상단 제목, 아래 카드 격자(폰 2열, 넓으면 3~4열) */
:root{color-scheme:light;--bg:#ffe48a;--ink:#3a2600;--card:#fff}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:17px/1.4 Jua,system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at 15% 10%,#fff6c9 0 18%,transparent 19%),radial-gradient(circle at 90% 85%,#ffd23f 0 22%,transparent 23%),var(--bg);min-height:100vh;min-height:100dvh}
header{padding:clamp(22px,5vw,48px) max(5vw,16px) 8px;max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:14px}
a:has(.logo){display:block;flex:none;border-radius:16px}a:has(.logo):focus-visible{outline:4px solid #3a2600;outline-offset:3px}
.logo{display:block;width:clamp(52px,12vw,72px);height:clamp(52px,12vw,72px);flex:none}
h1{margin:0;font-weight:400;font-size:clamp(34px,8vw,52px);line-height:1.05}
header p{margin:4px 0 0;font-size:18px;opacity:.75}
main{max-width:1100px;margin:0 auto;padding:18px max(5vw,16px) 48px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:clamp(14px,3vw,24px)}
@media(min-width:640px){main{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
.game{display:flex;flex-direction:column;background:var(--card);border-radius:28px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 8px 0 rgba(120,80,0,.25);transition:transform .15s}
.game:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(120,80,0,.25)}
.game:focus-visible{outline:4px solid #3a2600;outline-offset:4px}
.game .pic{aspect-ratio:1;display:grid;place-items:center}
.game img{width:100%;height:100%;object-fit:cover;display:block}
.game b{font-weight:400;font-size:clamp(19px,4.6vw,24px);padding:12px 14px 2px;line-height:1.15}
.game span{font-size:14px;padding:0 14px 14px;opacity:.65}
.empty{grid-column:1/-1;text-align:center;padding:40px;opacity:.6}
@media(prefers-reduced-motion:reduce){.game{transition:none}}
</style></head><body>
<header>
  <a href="./" aria-label="태오플레이 첫 화면"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
    <rect x="6" y="14" width="52" height="42" rx="12" fill="#e23b3b"/>
    <rect x="6" y="14" width="52" height="14" rx="7" fill="#ff6b6b"/>
    <circle cx="22" cy="40" r="6" fill="#ffd23f"/><circle cx="42" cy="40" r="6" fill="#6be3ff"/>
    <path d="M26 14 Q32 2 38 14" fill="none" stroke="#3a2600" stroke-width="4" stroke-linecap="round"/>
  </svg></a>
  <div><h1>태오플레이</h1><p>놀고 싶은 놀이를 골라요</p></div>
</header>
<main id="grid"></main>
<script src="games.js"></script>
<script>
{
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const games = window.BP_GAMES || [];
  const grid = document.getElementById('grid');
  grid.innerHTML = games.length
    ? games.map(g => `<a class="game" href="${esc(g.path)}"><div class="pic" style="background:${esc(g.color||'#ddd')}"><img src="${esc(g.thumb)}" alt=""></div><b>${esc(g.title)}</b><span>${esc(g.desc||'')}</span></a>`).join('')
    : '<p class="empty">아직 게임이 없어요</p>';
}
</script>
<script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(()=>{}))</script>
</body></html>
